[project]
name = "aipress24-client"
version = "0.1.0"
description = "Python client and command line for the AIpress24 public API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
cli = ["cyclopts>=5.5,<6", "markdown-it-py>=3", "pyyaml>=6"]

[project.scripts]
aipress24 = "aipress24_client.cli:main"

[project.urls]
Source = "https://github.com/aipress24/aipress24-sdk-python"

[dependency-groups]
dev = [
    # Those of the cli extra:
    "cyclopts>=5.5,<6",
    "markdown-it-py>=3",
    "pyyaml>=6",
    # The tools:
    "pytest>=8",
    "ruff>=0.15",
    "ty>=0.0.1a1",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipress24_client"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "openapi.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "examples"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/aipress24_client/client.py" = [
    "S310", # Client checks that base_url is http(s), and only requests that origin
]
"tests/*" = ["S101", "S105", "S106"]

[tool.ty.environment]
root = ["src", "scripts", "examples"]
